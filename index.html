  html,body{background:#090C11;}
  * { box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #262E3D; border-radius: 4px; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .display { font-family: 'Space Grotesk', sans-serif; }
  @keyframes fadeUp { from { opacity:0; transform: translateY(8px);} to {opacity:1; transform: translateY(0);} }
  .fade-up { animation: fadeUp .45s ease both; }
  @keyframes pulseLine {
    0% { stroke-dashoffset: 240; opacity:.3; }
    50% { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity:.3; }
  }
  .pulse-path { stroke-dasharray: 240; animation: pulseLine 2.6s linear infinite; }
  @keyframes ping-soft { 0% { transform: scale(0.6); opacity: .9; } 100% { transform: scale(2.6); opacity: 0; } }
  .ping-ring { animation: ping-soft 1.8s cubic-bezier(0,0,0.2,1) infinite; }
  @keyframes slideIn { from { opacity:0; transform: translateX(12px);} to {opacity:1; transform: translateX(0);} }
  .slide-in { animation: slideIn .4s ease both; }
  .count-tick { transition: all .4s ease; }
  input[type=range]{ -webkit-appearance:none; background:transparent; }
  input[type=range]::-webkit-slider-runnable-track{ height:4px; background:#212836; border-radius:2px;}
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; margin-top:-5px; width:14px; height:14px; border-radius:50%; background:#4CD3E8; box-shadow:0 0 8px rgba(76,211,232,.6);}
  .no-scrollbar::-webkit-scrollbar{ display:none; }
  .no-scrollbar{ -ms-overflow-style:none; scrollbar-width:none; }
